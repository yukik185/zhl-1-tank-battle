<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>坦克大战 · 作者：zhl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; color:#eee; }
  /* 背景板：整幅可见（contain），黑色补边，签名位于图底部 */
  #bg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  #bg img { max-width:100%; max-height:100%; object-fit:contain; }

  /* 开始界面：内容集中在上半区，避开中部 logo 与底部签名 */
  #menu { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding-top:5vh; gap:14px; z-index:5; text-align:center; }
  #menu h1 { font-size:clamp(28px,6vmin,52px); letter-spacing:.35em; text-indent:.35em;
    color:#ffd23c; text-shadow:0 0 18px rgba(255,210,60,.45), 2px 2px 0 #7a4a00; }
  #menu .sub { color:#9fd8ff; font-size:clamp(12px,2.2vmin,16px); letter-spacing:.2em; }
  #menu input { width:min(320px,72vw); padding:10px 14px; border:2px solid #444; border-radius:6px;
    background:rgba(20,20,20,.85); color:#eee; font-size:16px; text-align:center; outline:none; }
  #menu input:focus { border-color:#ffd23c; }
  #menu button { width:min(320px,72vw); padding:12px 0; border:none; border-radius:6px; cursor:pointer;
    background:linear-gradient(180deg,#ffd23c,#e6a400); color:#241a00; font-size:18px; font-weight:bold;
    letter-spacing:.4em; text-indent:.4em; box-shadow:0 4px 0 #7a4a00; }
  #menu button:active { transform:translateY(2px); box-shadow:0 2px 0 #7a4a00; }
  #menu .help { color:#bbb; font-size:clamp(11px,1.9vmin,14px); line-height:1.9;
    background:rgba(0,0,0,.55); padding:8px 18px; border-radius:8px; }
  #menu .author-note { color:#888; font-size:12px; }

  /* 战斗界面 */
  #game { position:fixed; inset:0; display:none; z-index:5; align-items:center; justify-content:center;
    flex-direction:column; background:rgba(0,0,0,.38); }
  #hud { display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap;
    padding:8px 16px; margin-bottom:8px; background:rgba(0,0,0,.7); border:1px solid #333; border-radius:8px;
    font-size:clamp(12px,2vmin,15px); color:#ddd; }
  #hud b { color:#ffd23c; }
  #board { position:relative; }
  canvas { display:block; background:transparent; border:4px solid #555; image-rendering:pixelated;
    width:min(92vmin,520px); height:min(92vmin,520px); }

  /* 结果浮层 */
  #overlay { position:fixed; inset:0; display:none; z-index:8; align-items:center; justify-content:center;
    background:rgba(0,0,0,.66); }
  #overlay .card { text-align:center; background:#151515; border:2px solid #ffd23c; border-radius:10px;
    padding:30px 46px; box-shadow:0 0 30px rgba(255,210,60,.25); }
  #overlay h2 { font-size:clamp(24px,5vmin,40px); color:#ffd23c; letter-spacing:.2em; margin-bottom:10px; }
  #overlay p { color:#ccc; margin-bottom:18px; font-size:clamp(13px,2.2vmin,16px); }
  #overlay button { padding:10px 34px; border:none; border-radius:6px; cursor:pointer; font-size:16px;
    background:linear-gradient(180deg,#ffd23c,#e6a400); color:#241a00; font-weight:bold; letter-spacing:.2em; }

  /* 暂停菜单 */
  #pauseMenu { position:fixed; inset:0; display:none; z-index:10; align-items:center; justify-content:center;
    background:rgba(0,0,0,.6); }
  #pauseMenu .panel { text-align:center; background:#151515; border:2px solid #ffd23c; border-radius:10px;
    padding:28px 44px; box-shadow:0 0 30px rgba(255,210,60,.25); }
  #pauseMenu h2 { color:#ffd23c; letter-spacing:.4em; text-indent:.4em; margin-bottom:20px;
    font-size:clamp(20px,4vmin,30px); }
  #pauseMenu button { display:block; width:220px; margin:0 auto 12px; padding:11px 0; border:none;
    border-radius:6px; cursor:pointer; font-size:16px; font-weight:bold; letter-spacing:.3em; text-indent:.3em; }
  #pauseMenu button:last-child { margin-bottom:0; }
  #pmResume { background:linear-gradient(180deg,#ffd23c,#e6a400); color:#241a00; }
  #pmRestart { background:#3a3a3a; color:#eee; }
  #pmMenu { background:#3a3a3a; color:#eee; }
  #pauseMenu button:active { transform:translateY(1px); }

  /* 移动端虚拟按键 */
  #touch { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom)); z-index:9; pointer-events:none; }
  #touch .pad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:4px; }
  #touch button { pointer-events:auto; border:none; border-radius:10px; background:rgba(255,255,255,.16);
    color:#fff; font-size:20px; touch-action:none; }
  #touch .fire { align-self:flex-end; width:76px; height:76px; border-radius:50%;
    background:rgba(255,90,60,.55); font-size:16px; font-weight:bold; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>

  <div id="bg"><img id="bgimg" alt="坦克大战背景板（作者：zhl）" onerror="this.onerror=null; if(window.__bgFallback) this.src=window.__bgFallback;"></div>

  <section id="menu">
    <h1>坦克大战</h1>
    <div class="sub">TANK BATTLE · 经典复刻</div>
    <input id="nick" maxlength="12" placeholder="输入昵称（可选）" autocomplete="off">
    <button id="startBtn" data-primary-action="start">开 始 游 戏</button>
    <div class="help">方向键 / WASD 移动 · 空格 开火 · P / Esc 暂停菜单 · Enter 开始<br>守住基地，消灭全部敌军！</div>
    <div class="author-note">背景板：浪尖儿 WavePeak Elite</div>
  </section>

  <section id="game">
    <div id="hud">
      <span>玩家 <b id="hudName">PLAYER</b></span>
      <span>得分 <b id="hudScore">0</b></span>
      <span>生命 <b id="hudLives">3</b></span>
      <span>第 <b id="hudLevel">1</b> 关</span>
      <span>剩余敌军 <b id="hudEnemy">0</b></span>
    </div>
    <div id="board"><canvas id="cv" width="416" height="416"></canvas></div>
  </section>

  <div id="overlay"><div class="card">
    <h2 id="ovTitle">关卡完成</h2>
    <p id="ovText"></p>
    <button id="ovBtn">继 续</button>
  </div></div>

  <div id="pauseMenu"><div class="panel">
    <h2>暂 停</h2>
    <button id="pmResume">继 续</button>
    <button id="pmRestart">重新开始</button>
    <button id="pmMenu">返回开始界面</button>
  </div></div>

  <div id="touch">
    <div class="pad">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
      <span></span><button data-k="down">▼</button><span></span>
    </div>
    <button class="fire" data-k="fire">开火</button>
  </div>

/* ---------- 状态 ---------- */
var state='menu';           // menu | playing | paused | clear | over
var grid=[], level=1, score=0, lives=3;
var player=null, enemies=[], bullets=[], booms=[], spawnFx=[];
var enemyTotal=0, enemySpawned=0, maxOnField=4, spawnTimer=0;
var basePos=null, baseDead=false;
var keys={};
var audioCtx=null;

function beep(freq,dur,type,vol){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.value=vol||0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); 
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+(dur||0.1));
    o.stop(audioCtx.currentTime+(dur||0.1));
  }catch(e){}
}

/* ---------- 关卡加载 ---------- */
function loadLevel(n){
  var src=MAPS[(n-1)%MAPS.length];
  grid=[]; basePos=null;
  for(var r=0;r<ROWS;r++){
    grid[r]=[];
    for(var c=0;c<COLS;c++){
      var ch=(src[r]&&src[r][c])||'.';
      var t=T_EMPTY;
      if(ch==='#')t=T_BRICK; else if(ch==='=')t=T_STEEL;
      else if(ch==='~')t=T_WATER; else if(ch==='*')t=T_GRASS;
      else if(ch==='B'){t=T_BASE; basePos={c:c,r:r};}
      grid[r][c]=t;
    }
  }
  // 基地四周补砖
  if(basePos){
    [[0,-1],[-1,0],[1,0],[0,1]].forEach(function(d){
      var c=basePos.c+d[0], r=basePos.r+d[1];
      if(r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===T_EMPTY) grid[r][c]=T_BRICK;
    });
  }
  // 出生点清空
  [[0,0],[0,6],[0,12],[ROWS-1,4],[ROWS-1,8]].forEach(function(p){
    if(grid[p[0]]) grid[p[0]][p[1]]=T_EMPTY;
  });
  enemyTotal=Math.min(8+n*2,20);
  enemySpawned=0; maxOnField=Math.min(4+Math.floor(n/2),6);
  spawnTimer=60; baseDead=false;
  enemies=[]; bullets=[]; booms=[]; spawnFx=[];
  player=makeTank(4*TILE+2,(ROWS-1)*TILE+2,'player');
  player.inv=90;
  updateHud();
}

function makeTank(x,y,kind){
  return {x:x,y:y,w:28,h:28,dir:'up',speed:kind==='player'?2.2:(kind==='fast'?1.8:(kind==='armor'?0.9:1.2)),
    kind:kind, hp:kind==='armor'?3:1, cooldown:0, inv:0, dirTimer:0, alive:true};
}

/* ---------- 碰撞 ---------- */
function solidForTank(t){ return t===T_BRICK||t===T_STEEL||t===T_WATER||t_BASE_CHECK(t); }
function t_BASE_CHECK(t){ return t===T_BASE; }
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function canMove(tank,dx,dy){
  var nx=tank.x+dx, ny=tank.y+dy;
  if(nx<0||ny<0||nx+tank.w>W||ny+tank.h>H) return false;
  var c0=Math.floor(nx/TILE), c1=Math.floor((nx+tank.w-1)/TILE);
  var r0=Math.floor(ny/TILE), r1=Math.floor((ny+tank.h-1)/TILE);
  for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++){
    if(solidForTank(grid[r][c])) return false;
  }
  var all=enemies.concat(player?[player]:[]);
  for(var i=0;i<all.length;i++){
    var o=all[i];
    if(o===tank||!o.alive) continue;
    if(rectHit({x:nx,y:ny,w:tank.w,h:tank.h},o)) return false;
  }
  return true;
}

var DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};

/* ---------- 子弹 ---------- */
function fire(tank,fromEnemy){
  if(tank.cooldown>0) return;
  var d=DIRV[tank.dir], sp=fromEnemy?4:6;
  var bx=tank.x+tank.w/2-3+d[0]*(tank.w/2), by=tank.y+tank.h/2-3+d[1]*(tank.h/2);
  bullets.push({x:bx,y:by,w:6,h:6,vx:d[0]*sp,vy:d[1]*sp,enemy:fromEnemy});
  tank.cooldown=fromEnemy?40:14;
  beep(fromEnemy?300:600,0.06,'square',0.03);
}

function bulletStep(b){
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<0||b.y<0||b.x+b.w>W||b.y+b.h>H){ b.dead=true; return; }
  var c=Math.floor((b.x+b.w/2)/TILE), r=Math.floor((b.y+b.h/2)/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS){ b.dead=true; return; }
  var t=grid[r][c];
  if(t===T_BRICK){ grid[r][c]=T_EMPTY; b.dead=true; boom(c*TILE+16,r*TILE+16,10); return; }
  if(t===T_STEEL){ b.dead=true; beep(180,0.05,'sawtooth',0.02); return; }
  if(t===T_BASE){ baseDead=true; b.dead=true; boom(basePos.c*TILE+16,basePos.r*TILE+16,26); gameOver(false); return; }
  if(b.enemy){
    if(player&&player.alive&&player.inv<=0&&rectHit(b,player)){
      b.dead=true; boom(player.x+14,player.y+14,20); playerDie(); return;
    }
  }else{
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i];
      if(e.alive&&rectHit(b,e)){
        b.dead=true; e.hp--;
        if(e.hp<=0){ e.alive=false; score+=(e.kind==='fast'?200:(e.kind==='armor'?300:100));
          boom(e.x+14,e.y+14,18); beep(120,0.2,'sawtooth',0.05); updateHud();
        } else { e.inv=6; beep(400,0.05,'square',0.03); }
        return;
      }
    }
  }
  // 子弹互撞
  for(var j=0;j<bullets.length;j++){
    var o=bullets[j];
    if(o!==b&&!o.dead&&o.enemy!==b.enemy&&rectHit(b,o)){ o.dead=true; b.dead=true; return; }
  }
}

function playerDie(){
  lives--; updateHud(); beep(90,0.4,'sawtooth',0.06);
  if(lives<=0){ gameOver(false); return; }
  player=makeTank(4*TILE+2,(ROWS-1)*TILE+2,'player'); player.inv=120;
}

/* ---------- 敌人 AI ---------- */
function enemyStep(e){
  if(e.inv>0)e.inv--;
  if(e.cooldown>0)e.cooldown--;
  e.dirTimer--;
  if(e.dirTimer<=0){
    e.dirTimer=40+Math.random()*80;
    var opts=['up','down','left','right'];
    // 偏向基地/玩家
    if(Math.random()<0.5){
      var tx=player&&player.alive?player.x:basePos.c*TILE;
      var ty=basePos.r*TILE;
      e.dir=Math.abs(tx-e.x)>Math.abs(ty-e.y)?(tx>e.x?'right':'left'):(ty>e.y?'down':'up');
    }else{
      e.dir=opts[Math.floor(Math.random()*4)];
    }
  }
  var d=DIRV[e.dir];
  if(canMove(e,d[0]*e.speed,d[1]*e.speed)){ e.x+=d[0]*e.speed; e.y+=d[1]*e.speed; }
  else { e.dirTimer=0; }
  if(e.cooldown<=0&&Math.random()<0.03) fire(e,true);
}

function spawnEnemy(){
  if(enemySpawned>=enemyTotal||enemies.filter(function(e){return e.alive;}).length>=maxOnField) return;
  var cols=[0,6,12], c=cols[enemySpawned%3];
  var spot={x:c*TILE+2,y:2};
  var blocked=enemies.some(function(e){return e.alive&&rectHit(spot,e);})||(player&&player.alive&&rectHit(spot,player));
  if(blocked) return;
  var roll=Math.random(), kind=roll<0.5?'basic':(roll<0.8?'fast':'armor');
  var e=makeTank(spot.x,spot.y,kind); e.dir='down'; e.inv=40;
  enemies.push(e); enemySpawned++; spawnFx.push({x:spot.x,y:spot.y,t:30});
  updateHud();
}

function boom(x,y,r){ booms.push({x:x,y:y,r:r,t:0}); beep(150,0.15,'sawtooth',0.04); }

/* ---------- 主循环 ---------- */
function step(){
  if(state!=='playing') return;
  if(player&&player.alive){
    if(player.inv>0)player.inv--;
    if(player.cooldown>0)player.cooldown--;
    var mv=null;
    if(keys.up)mv='up'; else if(keys.down)mv='down'; else if(keys.left)mv='left'; else if(keys.right)mv='right';
    if(mv){
      player.dir=mv;
      var d=DIRV[mv];
      if(canMove(player,d[0]*player.speed,d[1]*player.speed)){ player.x+=d[0]*player.speed; player.y+=d[1]*player.speed; }
    }
    if(keys.fire) fire(player,false);
  }
  enemies.forEach(enemyStep);
  enemies=enemies.filter(function(e){return e.alive;});
  bullets.forEach(bulletStep);
  bullets=bullets.filter(function(b){return !b.dead;});
  booms.forEach(function(b){b.t++;}); booms=booms.filter(function(b){b.t<20;});
  spawnFx.forEach(function(s){s.t--;}); spawnFx=spawnFx.filter(function(s){s.t>0;});
  spawnTimer--;
  if(spawnTimer<=0){ spawnTimer=90; spawnEnemy(); }
  // 过关判定
  if(!baseDead&&enemySpawned>=enemyTotal&&enemies.length===0){ levelClear(); }
}

/* ---------- 绘制 ---------- */
function drawTank(t,color){
  if(t.inv>0&&t.kind==='player'&&Math.floor(t.inv/4)%2===0) return;
  ctx.save();
  ctx.translate(t.x+t.w/2,t.y+t.h/2);
  var ang={up:0,right:Math.PI/2,down:Math.PI,left:-Math.PI/2}[t.dir];
  ctx.rotate(ang);
  ctx.fillStyle=color;
  ctx.fillRect(-14,-12,6,24); ctx.fillRect(8,-12,6,24);      // 履带
  ctx.fillRect(-8,-10,16,20);                                // 车身
  ctx.fillStyle=shade(color); ctx.fillRect(-4,-16,8,14);     // 炮管朝上
  ctx.fillStyle='#333'; ctx.fillRect(-5,-6,10,8);
  ctx.restore();
}
function shade(c){ return c==='#ffd23c'?'#b8901a':(c==='#e55'?'#a33':(c==='#8e8'?'#5a5':'#888')); }

function draw(){
  ctx.clearRect(0,0,W,H);
  // 底层地形
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var t=grid[r][c], x=c*TILE, y=r*TILE;
    if(t===T_BRICK){ ctx.fillStyle='#b5541e'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#7a3410'; ctx.fillRect(x,y+14,TILE,4); ctx.fillRect(x+14,y,4,14); ctx.fillRect(x+14,y+18,4,14); }
    else if(t===T_STEEL){ ctx.fillStyle='#ccc'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#777'; ctx.fillRect(x+4,y+4,TILE-8,TILE-8); }
    else if(t===T_WATER){ ctx.fillStyle='#1c4d8f'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='#2f6fc0'; ctx.fillRect(x,y+8+((Date.now()/300|0)%2)*8,TILE,4); }
    else if(t===T_BASE){ ctx.fillStyle='#ffd23c';
      ctx.beginPath(); ctx.moveTo(x+16,y+4); ctx.lineTo(x+28,y+14); ctx.lineTo(x+24,y+28); ctx.lineTo(x+8,y+28); ctx.lineTo(x+4,y+14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#7a4a00'; ctx.fillRect(x+12,y+16,8,8); }
  }
  spawnFx.forEach(function(s){ ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.strokeRect(s.x+4,s.y+4,24,24); });
  enemies.forEach(function(e){ drawTank(e, e.kind==='fast'?'#8e8':(e.kind==='armor'?'#e55':'#ddd')); });
  if(player&&player.alive) drawTank(player,'#ffd23c');
  ctx.fillStyle='#fff';
  bullets.forEach(function(b){ ctx.fillRect(b.x,b.y,b.w,b.h); });
  // 草地盖在坦克上
  for(var r2=0;r2<ROWS;r2++)for(var c2=0;c2<COLS;c2++){
    if(grid[r2][c2]===T_GRASS){ ctx.fillStyle='#2c7a2c'; ctx.fillRect(c2*TILE,r2*TILE,TILE,TILE);
      ctx.fillStyle='#3fa03f'; ctx.fillRect(c2*TILE+6,r2*TILE+6,8,8); ctx.fillRect(c2*TILE+20,r2*TILE+18,8,8); }
  }
  booms.forEach(function(b){
    var p=b.t/20;
    ctx.fillStyle='rgba(255,'+Math.floor(180*(1-p))+',40,'+(1-p)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(0.4+p),0,Math.PI*2); ctx.fill();
  });
}

/* ---------- 界面流转 ---------- */
var menuEl=document.getElementById('menu'), gameEl=document.getElementById('game'),
    ovEl=document.getElementById('overlay'),
    ovTitle=document.getElementById('ovTitle'), ovText=document.getElementById('ovText'),
    ovBtn=document.getElementById('ovBtn');

function updateHud(){
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudLives').textContent=Math.max(lives,0);
  document.getElementById('hudLevel').textContent=level;
  document.getElementById('hudEnemy').textContent=Math.max(enemyTotal-enemySpawned,0)+enemies.length;
}

function startGame(){
  var nick=document.getElementById('nick').value.trim();
  document.getElementById('hudName').textContent=nick||'PLAYER';
  score=0; lives=3; level=1;
  loadLevel(1);
  menuEl.style.display='none'; ovEl.style.display='none';
  gameEl.style.display='flex';
  state='playing';
  beep(520,0.12,'square',0.05);
}
function levelClear(){
  state='clear';
  ovTitle.textContent='第 '+level+' 关完成！';
  ovText.textContent='当前得分 '+score+' · 按 Enter 或点击按钮进入下一关';
  ovBtn.textContent='下一关';
  ovEl.style.display='flex';
  beep(660,0.15,'square',0.05); setTimeout(function(){beep(880,0.2,'square',0.05);},160);
}
function gameOver(win){
  if(state==='over') return;
  state='over';
  ovTitle.textContent=win?'胜利！':'游戏结束';
  ovText.textContent='最终得分 '+score+' · 到达第 '+level+' 关';
  ovBtn.textContent='重新开始';
  ovEl.style.display='flex';
  beep(200,0.3,'sawtooth',0.06);
}
function advance(){
  if(state==='clear'){ level++; loadLevel(level); ovEl.style.display='none'; state='playing'; }
  else if(state==='over'){ startGame(); }
}

document.getElementById('startBtn').addEventListener('click',function(){ if(state==='menu') startGame(); });
ovBtn.addEventListener('click',advance);

/* ---------- 输入 ---------- */
var KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire'};
window.addEventListener('keydown',function(e){
  var k=KEYMAP[e.code];
  if(k){ keys[k]=true; e.preventDefault(); }
  if(e.code==='Enter'){
    if(state==='menu') startGame();
    else if(state==='clear'||state==='over') advance();
  }
  if(e.code==='KeyP'||e.code==='Escape'){
    if(state==='playing') openPause();
    else if(state==='paused') closePause();
  }
});
var pauseEl=document.getElementById('pauseMenu');
function openPause(){ state='paused'; pauseEl.style.display='flex'; }
function closePause(){ state='playing'; pauseEl.style.display='none'; }
function toMenu(){
  state='menu'; keys={};
  pauseEl.style.display='none'; ovEl.style.display='none';
  gameEl.style.display='none'; menuEl.style.display='flex';
}
document.getElementById('pmResume').addEventListener('click',closePause);
document.getElementById('pmRestart').addEventListener('click',function(){ pauseEl.style.display='none'; startGame(); });
document.getElementById('pmMenu').addEventListener('click',toMenu);
window.addEventListener('keyup',function(e){ var k=KEYMAP[e.code]; if(k) keys[k]=false; });

/* 移动端按键 */
Array.prototype.forEach.call(document.querySelectorAll('#touch [data-k]'),function(btn){
  var k=btn.getAttribute('data-k');
  function on(e){ e.preventDefault(); keys[k]=true; }
  function off(e){ e.preventDefault(); keys[k]=false; }
  btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off);
  btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off);
});

/* ---------- 循环 ---------- */
var acc=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  acc+=now-last; last=now;
  var stepMs=1000/60;
  while(acc>=stepMs){ step(); acc-=stepMs; }
  if(state!=='menu') draw();
}
requestAnimationFrame(loop);
</script>
